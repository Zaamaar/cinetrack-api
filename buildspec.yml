version: 0.2

env:
  parameter-store:
    JWT_SECRET: "/cinetrack/jwt_secret"
    DB_PASSWORD: "/cinetrack/db_password"

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ECR_REPO_URI
      - REPOSITORY_URI=$ECR_REPO_URI
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - echo Installing dependencies and running tests...
      - npm ci
      - npm test
  build:
    commands:
      - echo Build started on `date`
      - echo Building the Docker image...
      - docker build -t $REPOSITORY_URI:latest -t $REPOSITORY_URI:$IMAGE_TAG .
  post_build:
    commands:
      - echo Build completed on `date`
      - echo Pushing the Docker image...
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo Updating task definition with new image URI...
      - sed -i "s|483528440029.dkr.ecr.us-east-1.amazonaws.com/cinetrack-api:latest|$REPOSITORY_URI:$IMAGE_TAG|g" task-definition.json
      - NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://task-definition.json --query 'taskDefinition.taskDefinitionArn' --output text)
      - echo Registered new task definition $NEW_TASK_DEF_ARN
      - aws ecs update-service --cluster cinetrack-cluster --service cinetrack-service --task-definition $NEW_TASK_DEF_ARN --force-new-deployment
      - echo Deploy triggered successfully
      - printf '[{"name":"cinetrack-api","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
